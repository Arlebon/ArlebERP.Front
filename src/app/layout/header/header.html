<header>
    <div class="flex justify-content-between align-items-center bg-blue-200 shadow-2">
        <h1 class="m-2">Arleb ERP</h1>
        <nav>
            @if(!isConnected()) {
                <p-button label="Register" severity="info" [raised]="true" routerLink="/auth/register"></p-button>
                <p-button label="Login" severity="info" [raised]="true" routerLink="/auth/login"></p-button>
            } @else {
                <p-button label="Logout" severity="info" [raised]="true" (onClick)="onLogout()"></p-button>
            }
        </nav>
    </div>
</header>
